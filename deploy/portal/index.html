<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Client Portal — JARVIS AI Agency</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@700&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; cursor: none; }
body { font-family: 'Inter', sans-serif; background: #07060A; color: #E8E0D0; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
.bg-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.bg-particles span { position: absolute; width: 2px; height: 2px; background: #C9A96E33; border-radius: 50%; animation: float 20s infinite; }
@keyframes float { 0% { transform: translateY(100vh) rotate(0deg); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-100vh) rotate(720deg); opacity: 0; } }

.cursor-dot { width: 8px; height: 8px; background: #C9A96E; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9999; box-shadow: 0 0 20px #C9A96E88; }
.cursor-ring { width: 40px; height: 40px; border: 2px solid #C9A96E66; border-radius: 50%; position: fixed; pointer-events: none; z-index: 9998; transition: all 0.15s; backdrop-filter: blur(4px); }

.login-box { background: linear-gradient(145deg, #0D0A15, #120E1A); border: 1px solid #C9A96E22; border-radius: 24px; padding: 60px 50px; width: 440px; text-align: center; position: relative; z-index: 1; animation: fadeInUp 1s ease; }
@keyframes fadeInUp { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
.login-box::before { content: ''; position: absolute; top: -1px; left: -1px; right: -1px; bottom: -1px; border-radius: 25px; background: linear-gradient(135deg, #C9A96E44, #D4AF3744, transparent, #C9A96E44); z-index: -1; animation: borderGlow 4s ease-in-out infinite; }
@keyframes borderGlow { 0%,100% { opacity: 0.3; } 50% { opacity: 0.8; } }
.login-logo { font-size: 28px; font-weight: 800; color: #C9A96E; letter-spacing: 2px; margin-bottom: 8px; font-family: 'Playfair Display', serif; }
.login-logo span { color: #F5E6D3; }
.login-box h1 { font-size: 20px; font-weight: 700; margin-bottom: 5px; color: #F5F0E8; }
.login-box p { color: #988E80; font-size: 13px; margin-bottom: 30px; line-height: 1.5; }
.login-box input { width: 100%; padding: 16px 20px; margin-bottom: 15px; background: #07060A; border: 1px solid #C9A96E22; border-radius: 12px; color: #F5F0E8; font-size: 14px; outline: none; transition: border-color 0.3s; }
.login-box input:focus { border-color: #C9A96E; box-shadow: 0 0 20px #C9A96E11; }
.login-box button { width: 100%; padding: 16px; background: linear-gradient(135deg, #C9A96E, #D4AF37); color: #07060A; border: none; border-radius: 12px; font-size: 15px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
.login-box button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px #C9A96E44; }
.login-box .hint { margin-top: 25px; font-size: 12px; color: #665E50; }
.login-box .hint a { color: #C9A96E; text-decoration: none; }

@media (max-width: 768px) {
  .login-box { width: 90%; padding: 40px 30px; }
  .cursor-dot, .cursor-ring { display: none; }
  * { cursor: auto; }
}
</style>
</head>
<body>
<div class="bg-particles" id="particles"></div>
<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>
<div class="login-box">
<div class="login-logo">JARVIS <span>AI</span></div>
<h1>Client Portal</h1>
<p>Enter your client ID to access your dashboard, deliverables, and reports.</p>
<form action="/portal/dashboard" method="GET">
<input type="text" name="client_id" placeholder="Your Client ID" required autofocus>
<button type="submit">✦ Access Portal</button>
</form>
<div class="hint">Don't have a client ID? <a href="mailto:agency@jarvisai.business">Contact support</a></div>
</div>
<script>
const container = document.getElementById('particles');
for (let i = 0; i < 50; i++) {
  const span = document.createElement('span');
  span.style.left = Math.random() * 100 + '%';
  span.style.animationDelay = Math.random() * 20 + 's';
  span.style.animationDuration = (15 + Math.random() * 15) + 's';
  span.style.width = span.style.height = (1 + Math.random() * 3) + 'px';
  container.appendChild(span);
}
const cd = document.getElementById('cursorDot');
const cr = document.getElementById('cursorRing');
let m = {x:0,y:0}, r = {x:0,y:0};
document.addEventListener('mousemove', e => { m.x=e.clientX; m.y=e.clientY; cd.style.left=m.x-4+'px'; cd.style.top=m.y-4+'px'; });
function anim() { r.x += (m.x-r.x)*0.12; r.y += (m.y-r.y)*0.12; cr.style.left=r.x-20+'px'; cr.style.top=r.y-20+'px'; requestAnimationFrame(anim); }
anim();
document.querySelectorAll('a, button, input').forEach(el => {
  el.addEventListener('mouseenter', () => cr.style.borderColor='#D4AF37'); el.addEventListener('mouseleave', () => cr.style.borderColor='#C9A96E66');
});
</script>
</body>
</html>
